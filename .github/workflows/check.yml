name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Step files match the archived notebook
        run: python tools/export_notebook.py --check
      - name: All Python files compile
        run: python -m compileall -q src tools run.py
